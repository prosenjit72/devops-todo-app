version: '3.8'

services:

  # ── Service 1: PostgreSQL database ──────────────
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       todoapp
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: secret123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Service 2: Flask app ─────────────────────────
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://admin:secret123@db:5432/todoapp
    depends_on:
      db:
        condition: service_healthy

# Data persist করার জন্য named volume
volumes:
  postgres_data: